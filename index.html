<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YUME RADIO — Anime Music Stream</title>
  <meta name="description" content="YUME RADIO — Free 24/7 anime music streaming. JPOP & KPOP powered by listen.moe." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-dots"></div>

  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-icon"><i class="ph-fill ph-waveform"></i></div>
      <div class="brand-text">YUME<span>RADIO</span></div>
    </div>

    <div class="station-tabs">
      <button class="tab active" id="tabJpop" onclick="switchStation('jpop')">
        <i class="ph ph-music-note"></i> JPOP
      </button>
      <button class="tab" id="tabKpop" onclick="switchStation('kpop')">
        <i class="ph ph-music-note"></i> KPOP
      </button>
    </div>

    <div class="topbar-right">
      <div class="listener-chip">
        <span class="live-dot"></span>
        <i class="ph ph-headphones"></i>
        <span id="listenerCount">—</span>
      </div>
      <a class="nav-icon-btn" href="https://discord.gg/listenmoe" target="_blank" rel="noopener" title="Discord">
        <i class="ph ph-discord-logo"></i>
      </a>
      <button class="nav-icon-btn" id="btnHistory" onclick="toggleHistoryPanel()" title="History">
        <i class="ph ph-clock-counter-clockwise"></i>
      </button>
    </div>
  </header>

  <main class="player-layout">

    <div class="art-col">
      <div class="art-frame" id="artFrame">
        <img id="artImg" src="" alt="Album Art" />
        <div class="art-fallback" id="artFallback">
          <i class="ph-thin ph-vinyl-record"></i>
        </div>
        <div class="art-ring" id="artRing"></div>
        <div class="art-playing-badge" id="artPlayingBadge" style="display:none">
          <span class="bar b1"></span>
          <span class="bar b2"></span>
          <span class="bar b3"></span>
          <span class="bar b4"></span>
        </div>
      </div>

      <div class="art-meta">
        <span class="station-chip" id="stationChip">JPOP</span>
        <span class="art-source">via listen.moe</span>
      </div>

      <div class="art-side-info">
        <p class="side-title" id="sideTitle">—</p>
        <p class="side-artist" id="sideArtist">—</p>
      </div>
    </div>

    <div class="player-col">

      <div class="song-block">
        <div class="live-tag">
          <span class="live-dot pulse"></span>
          LIVE STREAM
        </div>
        <h1 class="song-title" id="songTitle">Loading...</h1>
        <p class="song-artist" id="songArtist">—</p>
        <p class="song-anime" id="songAnime"></p>
      </div>

      <div class="eq-block">
        <div class="eq-header">
          <i class="ph ph-equalizer"></i>
          <span>EQUALIZER</span>
        </div>
        <div class="eq-bars" id="eqBars">

        </div>
      </div>

      <div class="progress-block">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-times">
          <span id="timeElapsed">0:00</span>
          <span id="timeDuration">—</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" id="favoriteBtn" onclick="toggleFavorite()" title="Favorite">
          <i class="ph ph-heart" id="favoriteIcon"></i>
        </button>

        <button class="play-btn" id="playBtn" onclick="togglePlay()">
          <i class="ph-fill ph-play" id="playIcon"></i>
        </button>

        <div class="vol-group">
          <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">
            <i class="ph ph-speaker-high" id="volumeIcon"></i>
          </button>
          <input type="range" class="vol-slider" id="volumeSlider"
                 min="0" max="100" value="80" oninput="setVolume(this.value)" />
        </div>
      </div>

    </div>
  </main>

  <aside class="history-panel" id="historyPanel">
    <div class="history-panel-header">
      <div class="history-panel-title">
        <i class="ph ph-clock-counter-clockwise"></i>
        Recent Tracks
      </div>
      <button class="ctrl-btn" onclick="toggleHistoryPanel()">
        <i class="ph ph-x"></i>
      </button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">
        <i class="ph-thin ph-music-note-simple"></i>
        <span>No tracks yet. Start listening!</span>
      </div>
    </div>
  </aside>
  <div class="history-overlay" id="historyOverlay" onclick="toggleHistoryPanel()"></div>

  <div class="toast" id="toast">
    <i class="ph ph-check-circle" id="toastIcon"></i>
    <span id="toastMsg">—</span>
  </div>

  <audio id="audioEl" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
